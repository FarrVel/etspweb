<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keuangan Rumah Tangga</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Catatan Keuangan Rumah Tangga</h1>

    <form id="form-transaksi">
        <h2>Daftar Transaksi</h2>
        <ul id="daftar-transaksi"></ul>
        <label>Tanggal <input type="date" id="tanggal"></label>
        <label>Jenis
            <select id="jenis">
                <option value="pengeluaran">Pengeluaran</option>
                <option value="pemasukan">Pemasukan</option>
            </select>
        </label>
        <label>Kategori <select id="kategori"></select></label>
        <label>Nominal (Rp) <input type="number" id="nominal"></label>
        <label>Catatan (opsional) <input type="text" id="catatan"></label>
        <button type="submit">Simpan</button>
    </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
